# AI-DEV NOTE: signed iOS build, MANUAL only (Sreeni, 2026-11-22), like
# android-release. Runs in the "ios-release" environment, which must have Sreeni
# as a required reviewer: it holds an App Store Connect Admin API key. Signing is
# Xcode's automatic signing through that key. The archive is AD-HOC signed
# (identity "-"): development signing would create a new Apple Development
# certificate on every throwaway runner, and Apple caps those, while a fully
# unsigned archive carries no entitlements, so the export shipped an app without
# push or Sign in with Apple (first dry run, 2026-11-22). The export re-signs it
# once with Apple's cloud-managed distribution certificate, keeping the archive's
# entitlements (no certificate or profile stored here). Both modes export and
# check the IPA; "testflight" then uploads that same IPA to App Store Connect.
name: ios-release (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
      upload:
        description: Upload to TestFlight?
        type: choice
        options: [none, testflight]
        default: none
  # Called by release.yml so Android and iOS build the same commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      upload:
        type: string
        required: false
        default: none

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    defaults:
      run:
        working-directory: app
        shell: bash # -eo pipefail: a failing command inside a pipe stops the step
    env:
      TEAM_ID: M3KBNG884H
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Paths
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64 IOS_GOOGLE_SERVICE_INFO_PLIST_B64 \
                      VITE_SUPABASE_URL VITE_SUPABASE_KEY VITE_VAPID_PUBLIC_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Write app/.env (public client config only)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_URL: https://app.nithyakarma.org
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_KEY=$VITE_SUPABASE_KEY"
            echo "VITE_VAPID_PUBLIC_KEY=$VITE_VAPID_PUBLIC_KEY"
            echo "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY"
            echo "VITE_SENTRY_DSN=$VITE_SENTRY_DSN"
            echo "VITE_APP_URL=$VITE_APP_URL"
          } > .env

      - run: npm run build
      - run: node scripts/check-build-syntax.mjs
      - run: npx cap sync ios

      - name: Refuse debug logging in a release build
        run: |
          grep -q '"loggingBehavior": *"none"' ios/App/App/capacitor.config.json \
            || { echo "::error::capacitor loggingBehavior is not 'none' (CAP_DEBUG_LOGS set?)"; exit 1; }

      - name: Restore Firebase config and the App Store Connect key
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          [ "$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)" = "org.nithyakarma.app" ] \
            || { echo "::error::GoogleService-Info.plist is not for org.nithyakarma.app"; exit 1; }
          umask 077
          echo "$ASC_KEY_P8_B64" | base64 -d > "$ASC_KEY_PATH"

      - name: Version and build number
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # AI-DEV NOTE: minutes since epoch, like Android's versionCode: always
          # increasing, and unique because runs never overlap (concurrency group).
          BUILD=$(( $(date +%s) / 60 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($BUILD)"

      - run: xcodebuild -version

      - name: Archive (ad-hoc signed, entitlements embedded)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            archive

      - name: Archive must carry the push and Sign in with Apple entitlements
        run: |
          APP="$ARCHIVE/Products/Applications/App.app"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/archive-entitlements.plist"
          plutil -p "$RUNNER_TEMP/archive-entitlements.plist"
          plutil -extract aps-environment raw "$RUNNER_TEMP/archive-entitlements.plist" > /dev/null \
            || { echo "::error::archive has no aps-environment entitlement"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$RUNNER_TEMP/archive-entitlements.plist")" = "Default" ] \
            || { echo "::error::archive has no Sign in with Apple entitlement"; exit 1; }

      - name: Export a signed IPA (cloud-managed distribution signing)
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTS"
          plutil -insert method -string app-store-connect "$OPTS"
          plutil -insert destination -string export "$OPTS"
          plutil -insert signingStyle -string automatic "$OPTS"
          plutil -insert teamID -string "$TEAM_ID" "$OPTS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$OPTS"
          plutil -insert uploadSymbols -bool YES "$OPTS"
          plutil -p "$OPTS"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$OPTS" -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$EXPORT_DIR"

      # AI-DEV NOTE: checked on the exported IPA, the thing that ships: push only
      # works in TestFlight/App Store with aps-environment=production.
      - name: Check the exported IPA
        id: ipa
        run: |
          shopt -s nullglob
          IPAS=("$EXPORT_DIR"/*.ipa)
          [ ${#IPAS[@]} -eq 1 ] || { echo "::error::expected exactly one IPA, found ${#IPAS[@]}"; exit 1; }
          IPA="${IPAS[0]}"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APPS=("$RUNNER_TEMP"/ipa/Payload/*.app)
          [ ${#APPS[@]} -eq 1 ] || { echo "::error::expected exactly one .app in the IPA"; exit 1; }
          APP="${APPS[0]}"
          codesign --verify --strict "$APP"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          [ "$(plutil -extract aps-environment raw "$RUNNER_TEMP/entitlements.plist")" = "production" ] \
            || { echo "::error::IPA is not signed with aps-environment=production"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$RUNNER_TEMP/entitlements.plist")" = "Default" ] \
            || { echo "::error::Sign in with Apple entitlement missing"; exit 1; }
          [ "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "org.nithyakarma.app" ] \
            || { echo "::error::unexpected bundle id"; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::privacy manifest not bundled"; exit 1; }
          test -f "$APP/GoogleService-Info.plist" || { echo "::error::GoogleService-Info.plist not bundled"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -E "^Authority=Apple Distribution" \
            || { echo "::error::IPA is not signed with an Apple Distribution certificate"; exit 1; }
          echo "Version $(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist") ($(plutil -extract CFBundleVersion raw "$APP/Info.plist"))"

      - name: Upload to TestFlight
        if: inputs.upload == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # altool reads the key from this folder by its id.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "${{ steps.ipa.outputs.path }}" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v7
        if: inputs.upload == 'none'
        with:
          name: nithyakarma-ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ env.EXPORT_DIR }}/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -rf "$ASC_KEY_PATH" "$HOME/.appstoreconnect" ios/App/App/GoogleService-Info.plist .env "$RUNNER_TEMP/ExportOptions.plist"
