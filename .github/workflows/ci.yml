name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

  edge-functions:
    # supabase/functions/** runs on Deno, not Node - excluded from the `verify`
    # job's `npm run test` (vitest/esbuild can't parse Deno.test or jsr:
    # imports). Was entirely untested in CI until this job; observanceMatch.ts
    # is the first Deno-side test this project has, added alongside Phase 3
    # of the panchangam-observances work (2026-07-23).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Whole directory rather than a file-per-line list, so a newly added
      # _shared/*.test.ts runs in CI without anyone remembering to add it here
      # (freezeNudge.test.ts was written before this line changed, and would
      # silently not have run).
      - run: deno test supabase/functions/_shared/

  e2e:
    runs-on: ubuntu-latest
    # 2026-08-19: npx playwright install --with-deps chromium's internal
    # apt-get hung silently (network flake on the runner's package mirror)
    # for 1h19m with zero output before the default 6h job timeout would
    # ever have caught it - had to be manually cancelled. This bound fails
    # the job fast instead. 20 min is generous headroom over a normal run
    # (npm ci + browser install + build + the non-destructive e2e suite).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      # No VITE_TURNSTILE_SITE_KEY here on purpose: Cloudflare Turnstile's
      # bot-detection reliably never resolves a token for a headless CI
      # browser (confirmed - it can hang 40s+ with zero callback), and even
      # when it occasionally does resolve, Supabase still rejected the
      # request with "no captcha_token found". Real users get a real browser
      # and resolve fine; CI stays Turnstile-free per Turnstile.jsx's own
      # design (a no-op until a site key is configured).
      # Two tags are excluded here, and both are deliberate manual gates:
      #   @destructive - journey.spec.js deletes a shared live account and must
      #     be re-seeded before each run.
      #   @manual - referral.spec.js tests the *signup* flow (captcha-blocked
      #     for a headless browser, and seeding a session cannot help because
      #     signup is the thing under test) and needs a hand-seeded throwaway
      #     account first.
      # E2E_EMAIL/PASSWORD are the e2efull journey account's own fallback creds
      # (journey.spec.js is @destructive and excluded here anyway).
      #
      # auth-signout.spec.js and journey-child.spec.js both need a signed-in
      # session. Neither can get one by typing a password: captcha protection
      # is on project-wide and Turnstile issues no token to a headless browser
      # (see e2e/helpers/session.js). They seed one through the admin API
      # instead, which needs SUPABASE_SERVICE_ROLE_KEY + E2E_UI_EMAIL (the
      # never-deleted e2e@nithyakarma.test account).
      #
      # This previously listed E2E_UI_EMAIL/E2E_UI_PASSWORD as though they were
      # configured. Neither ever existed as a repo secret, so *both* of those
      # specs skipped themselves on every run while CI reported green. They now
      # fail loudly in CI if these are missing, rather than skipping.
      #
      # SUPABASE_SERVICE_ROLE_KEY is not VITE_-prefixed on purpose: it is read
      # only in the Playwright node process and must never be inlined into the
      # client bundle.
      - run: npx playwright test --grep-invert "@destructive|@manual"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UI_EMAIL: ${{ secrets.E2E_UI_EMAIL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
