# AI-DEV NOTE: Mutation testing, manual + weekly (too slow for every PR).
# - js: Stryker mutates the native-bridge wrappers and the R8 checker; surviving
#   mutants mean a test would not notice that bug.
# - r8-rules: each job breaks one piece of the R8 config on purpose, confirms R8
#   really saw the change (configuration.txt), and requires r8-verify.sh to FAIL.
#   A mutant that passes the check means the R8 gate has a blind spot.
name: mutation

on:
  workflow_dispatch:
  # Also when the mutation tooling itself changes, so a broken mutant or config
  # is caught in its own PR instead of at the next weekly run.
  pull_request:
    paths:
      - '.github/workflows/mutation.yml'
      - 'app/scripts/r8-mutate.mjs'
      - 'app/stryker.config.json'
  schedule:
    - cron: '30 21 * * 0' # Sunday 21:30 UTC (Monday 03:00 IST)

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: app/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  r8-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutant: [drop-capacitor-plugin-keeps, drop-js-interface-keep, minify-off, dontobfuscate]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: r8-check-placeholder
      - run: npx cap sync android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Extract AGP default ProGuard files
        working-directory: app/android
        run: ./gradlew --no-daemon :app:extractProguardFiles
      - run: node scripts/r8-mutate.mjs ${{ matrix.mutant }}
      - name: Build unsigned release APK with the mutant
        working-directory: app/android
        run: ./gradlew --no-daemon assembleRelease
      - run: node scripts/r8-mutate.mjs ${{ matrix.mutant }} --assert
      - name: The R8 check must catch the mutant
        run: |
          if bash scripts/r8-verify.sh android/app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo "::error::Mutant ${{ matrix.mutant }} SURVIVED - r8-check did not notice it"
            exit 1
          fi
          echo "Mutant ${{ matrix.mutant }} killed"
