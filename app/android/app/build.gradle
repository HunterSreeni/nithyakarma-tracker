apply plugin: 'com.android.application'

// Release signing is driven by a gitignored keystore.properties (see
// keystore.properties.example). When it's absent - CI, a fresh clone, or a debug
// build - the release type stays unsigned and everything else still builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.nithyakarma.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.nithyakarma.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def appVersionName = "0.31.8" // x-release-please-version
        // versionCode = (major*10000 + minor*100 + patch) * 20000 + minutes-since-epoch.
        // Pure version-derived versionCode (major*10000+minor*100+patch) collided the
        // moment we rebuilt the *same* versionName to re-upload a closed-testing AAB
        // with no version bump (e.g. after fixing an env var) - Play rejects a re-upload
        // with a duplicate versionCode, and release-please only bumps versionName on
        // real releases, not local rebuilds. Minutes-since-epoch as the low digits makes
        // versionCode strictly increase on every single build, version bump or not, so
        // any local `bundleRelease`/`assembleRelease` is always uploadable. The *20000
        // multiplier just keeps the version bump visible in the number; ordering across
        // builds relies entirely on wall-clock time moving forward, not on that digit.
        def (major, minor, patch) = appVersionName.tokenize('.').collect { it.toInteger() }
        def computedVersionCode = (major * 10000 + minor * 100 + patch) * 20000 + (int) (System.currentTimeMillis() / 60000)
        versionCode computedVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Package native debug symbols already shipped inside dependency AARs
            // (AdMob etc.) into the AAB, so Play can symbolicate native crashes/ANRs.
            // Safe/additive - doesn't require this project to build any native code
            // itself, and has no effect on minifyEnabled (see AGENTS.md/UPGRADE-PLAN
            // Intent R5 for why minification itself stays off for now).
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
