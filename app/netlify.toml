[build]
  command = "npm run build"
  publish = "dist"

# AI-DEV NOTE: same-origin PostHog (EU) proxy, so the CSP keeps connect-src 'self'
# and ad-blockers do not drop analytics. Must stay ABOVE the SPA catch-all (first
# match wins). Only ingestion is proxied: the SDK loads no remote scripts.
[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://fkrifejzhnhknkuyhjhp.supabase.co wss://fkrifejzhnhknkuyhjhp.supabase.co https://challenges.cloudflare.com https://o4511782596902912.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
